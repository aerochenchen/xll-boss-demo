<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="汽车贸易管理系统 · 员工端演示（与老板端联动）">
<title>汽车贸易管理系统 · 员工端</title>
<style>
  :root {
    --ink: #2C3A4A; --navy: #4A6FA5; --navy-soft: #E8EEF6; --paper: #F7F8FA;
    --foreground: #2C3A4A; --muted-foreground: #6B7A8D; --border: #E5E9EF;
    --accent: #F0F3F7; --danger: #C45C52; --warn: #C48A3A; --ok: #4A8B64;
    --hot-bg: #FBF2F1; --ok-bg: #F1F7F3; --warn-bg: #FBF6EE; --s: 1.3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--foreground);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    height: 100%; overscroll-behavior: none; }
  button { font-family: inherit; }
  .app { max-width: 480px; margin: 0 auto; height: 100dvh; min-height: 100vh; display: flex; flex-direction: column;
    font-size: calc(16px * var(--s)); background: var(--paper); }
  .top { background: #FAFBFC; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top,0) 12px 10px; flex: none; }
  .top .row { display: flex; align-items: center; gap: 8px; }
  .top .t { font-size: 0.9688em; font-weight: 700; color: var(--ink); flex: 1; }
  .link-boss { font-size: 0.625em; font-weight: 600; color: var(--navy); text-decoration: none;
    border: 1px solid #C5D2E6; background: var(--navy-soft); border-radius: 8px; padding: 8px 10px; white-space: nowrap; }
  .roles { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .roles button {
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px; font-size: 0.6562em;
    font-weight: 600; background: #fff; color: var(--muted-foreground); cursor: pointer;
  }
  .roles button.on { background: var(--navy-soft); color: var(--navy); border-color: #C5D2E6; }
  .body { flex: 1; overflow-y: auto; padding: 12px 13px 14px; }
  .body::-webkit-scrollbar { width: 0; }
  .screen { display: none; }
  .screen.on { display: block; }
  .sect { font-size: 0.8125em; font-weight: 700; margin: 14px 0 8px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  .sect:first-child { margin-top: 2px; }
  .sect span + span { font-size: 0.6875em; font-weight: 400; color: var(--muted-foreground); }
  .row-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .row-item {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; border-left: 3px solid #D4A5A0; padding: 10px 10px 10px 11px;
  }
  .row-item.w { border-left-color: #D4B888; }
  .row-item.g { border-left-color: #A8C9B4; }
  .row-main { flex: 1; min-width: 0; cursor: pointer; }
  .r { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .car { font-size: 0.8125em; font-weight: 700; color: var(--ink); }
  .meta { font-size: 0.6562em; color: var(--muted-foreground); margin-top: 3px; line-height: 1.4; }
  .dur { font-size: 0.6562em; white-space: nowrap; color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dur.w { color: var(--warn); } .dur.g { color: var(--ok); }
  .btn-sm {
    flex: none; min-width: 64px; min-height: 36px; padding: 0 10px; border: 1px solid #C5D2E6;
    border-radius: 8px; background: var(--navy-soft); color: #3D5A80; font-size: 0.6875em; font-weight: 600; cursor: pointer;
  }
  .btn-sm:active { background: #D0DBEA; }
  .btn {
    width: 100%; min-height: 44px; margin-top: 8px; border: 1px solid #C5D2E6; border-radius: 8px;
    background: var(--navy-soft); color: #3D5A80; font-size: 0.8125em; font-weight: 700; cursor: pointer;
  }
  .btn.ghost { background: #fff; border-color: var(--border); color: var(--foreground); font-weight: 600; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 11px; background: #fff; margin-bottom: 8px; }
  .focus-card { border: 1px solid #E8D9B8; border-radius: 10px; background: var(--warn-bg); padding: 12px 11px; margin-bottom: 10px; }
  .focus-card .step { font-size: 0.9375em; font-weight: 700; color: var(--ink); }
  .focus-card .subline { font-size: 0.6562em; color: var(--muted-foreground); margin-top: 6px; line-height: 1.5; }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted-foreground); font-size: 0.75em; }
  .nav { display: flex; border-top: 1px solid var(--border); background: #fff; flex: none; padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav button {
    flex: 1; background: transparent; border: 0; font-size: 0.625em; color: #8A96A6; padding: 8px 2px 10px;
    cursor: pointer; font-weight: 500; min-height: 52px;
  }
  .nav button.on { color: var(--navy); font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%);
    background: #5A6A7A; color: #fff; font-size: 0.75em; padding: 10px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .22s; pointer-events: none; z-index: 20; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .who { font-size: 0.625em; color: var(--muted-foreground); line-height: 1.5; }
  .back { border: 0; background: transparent; color: #6B7A8D; font-size: 0.875em; padding: 4px 8px 4px 0; cursor: pointer; font-weight: 600; }
  @media (min-width: 520px) {
    html, body { background: #EEF1F5; }
    .app { margin: 24px auto; height: 772px; min-height: 772px; border: 1px solid #D8DEE6; border-radius: 28px; overflow: hidden; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <div class="t" id="hdTitle">员工端</div>
      <a class="link-boss" href="./index.html">老板端</a>
    </div>
    <div class="roles" id="roleBar" role="tablist" aria-label="切换角色"></div>
  </div>

  <div class="body">
    <div class="screen on" id="s-todo"></div>
    <div class="screen" id="s-mine"></div>
    <div class="screen" id="s-check"></div>
    <div class="screen" id="s-msg"></div>
    <div class="screen" id="s-detail"></div>
  </div>

  <div class="nav" id="nav">
    <button type="button" class="on" data-t="todo" onclick="tab('todo')">待办</button>
    <button type="button" data-t="mine" onclick="tab('mine')">我的单</button>
    <button type="button" data-t="check" onclick="tab('check')">打卡</button>
    <button type="button" data-t="msg" onclick="tab('msg')">消息</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="./store.js"></script>
<script>
var ROLES = [
  { id: 'Nina', label: 'Nina · 业务' },
  { id: '张青昊', label: '张青昊 · 业务' },
  { id: '波塔', label: '波塔 · 内勤' },
  { id: '那尔', label: '那尔 · 外勤' }
];
var role = 'Nina';
var tabName = 'todo';
var detailId = null;
var track = ['todo'];
var toastTimer = null;

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

function setRole(id) {
  role = id;
  XLLStore.applyAction('set_role', { role: id });
  document.querySelectorAll('#roleBar button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.role === id);
  });
  if (track[track.length - 1] === 'detail') { track = [tabName]; detailId = null; }
  render();
}

function tab(name) {
  tabName = name;
  track = [name];
  detailId = null;
  document.querySelectorAll('#nav button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.t === name);
  });
  render();
}

function openDetail(id) {
  detailId = id;
  track.push('detail');
  render();
}

function back() {
  if (track.length > 1) {
    track.pop();
    detailId = null;
    render();
  }
}

function action(name, orderId) {
  var res = XLLStore.applyAction(name, { orderId: orderId, role: role });
  if (res.toast) showToast(res.toast);
  render();
}

function primaryAction(o) {
  if (role === 'Nina' || role === '张青昊') {
    if (o.phase === 'inquiry' && !o.accepted) return { act: 'accept', label: '已接单' };
    if (o.phase === 'inquiry') return { act: 'quote', label: '已报价' };
  }
  if (role === '波塔' && o.phase === 'fx') return { act: 'fx_done', label: '确认换汇' };
  if (role === '那尔' && o.phase === 'inspect') return { act: 'inspect_done', label: '验车完成' };
  return null;
}

function rowHtml(o, withBtn) {
  var pa = withBtn ? primaryAction(o) : null;
  var cls = o.stuck ? 'row-item' : 'row-item w';
  if (!o.stuck && (o.phase === 'quoted' || o.phase === 'license' || o.phase === 'exit')) cls = 'row-item g';
  var btn = pa
    ? '<button type="button" class="btn-sm" onclick="event.stopPropagation();action(\'' + pa.act + '\',\'' + o.id + '\')">' + pa.label + '</button>'
    : '';
  return '<div class="' + cls + '">' +
    '<div class="row-main" onclick="openDetail(\'' + o.id + '\')">' +
      '<div class="r"><div class="car">' + o.title + '</div><div class="dur">' + o.dur + '</div></div>' +
      '<div class="meta">' + o.stepShort + ' · ' + o.owner + '</div>' +
    '</div>' + btn + '</div>';
}

function renderTodo(state) {
  var list = XLLStore.todosForRole(state, role);
  var html = '<div class="sect"><span>今日待办</span><span>' + role + '</span></div>';
  if (!list.length) html += '<div class="empty">暂无待办 · 状态已同步老板端</div>';
  else {
    html += '<div class="row-list">';
    list.forEach(function (o) { html += rowHtml(o, true); });
    html += '</div>';
  }
  document.getElementById('s-todo').innerHTML = html;
}

function renderMine(state) {
  var list = XLLStore.myOrders(state, role);
  var html = '<div class="sect"><span>我的在途</span><span>' + list.length + ' 单</span></div><div class="row-list">';
  if (!list.length) html += '<div class="empty">暂无关联订单</div>';
  else list.forEach(function (o) { html += rowHtml(o, true); });
  html += '</div>';
  document.getElementById('s-mine').innerHTML = html;
}

function renderCheck(state) {
  var done = !!(state.daily && state.daily[role]);
  var isSales = role === 'Nina' || role === '张青昊';
  var html = '<div class="sect"><span>今日打卡</span></div><div class="card">';
  if (isSales) {
    html += '<div class="car" style="font-size:0.875em">日报（约 10 秒）</div>' +
      '<div class="who" style="margin-top:6px">有进展 / 无进展 + 询价 · 已报价 · 意向 · 难点</div>';
    if (done) html += '<button type="button" class="btn ghost" disabled>今日已提交</button>';
    else html += '<button type="button" class="btn" onclick="action(\'daily\')">提交：今日有进展</button>';
  } else if (role === '波塔') {
    html += '<div class="car" style="font-size:0.875em">内勤到岗</div><div class="who" style="margin-top:6px">11:00–20:00 · 演示一键确认</div>';
    html += done
      ? '<button type="button" class="btn ghost" disabled>已确认到岗</button>'
      : '<button type="button" class="btn" onclick="action(\'daily\')">确认到岗</button>';
  } else {
    html += '<div class="car" style="font-size:0.875em">外勤报备</div><div class="who" style="margin-top:6px">口岸 / 验车 · 演示一键报备</div>';
    html += done
      ? '<button type="button" class="btn ghost" disabled>已报备</button>'
      : '<button type="button" class="btn" onclick="action(\'daily\')">外勤报备</button>';
  }
  html += '</div><button type="button" class="btn ghost" onclick="var r=XLLStore.applyAction(\'reset\');showToast(r.toast);render();">重置演示数据</button>';
  html += '<div class="who" style="margin-top:10px;text-align:center">与老板端同一浏览器可联动 · 改完请打开老板端查看</div>';
  document.getElementById('s-check').innerHTML = html;
}

function renderMsg(state) {
  var list = XLLStore.messagesFor(state, role);
  var html = '<div class="sect"><span>消息</span><span>催办与提醒</span></div><div class="row-list">';
  if (!list.length) html += '<div class="empty">暂无消息</div>';
  else list.forEach(function (m) {
    html += '<div class="row-item w" onclick="' + (m.orderId ? 'openDetail(\'' + m.orderId + '\')' : '') + '">' +
      '<div class="row-main"><div class="r"><div class="car">' + m.title + '</div><div class="dur w">' + m.t + '</div></div>' +
      '<div class="meta">' + m.body + '</div></div></div>';
  });
  html += '</div>';
  document.getElementById('s-msg').innerHTML = html;
}

function renderDetail(state) {
  var o = state.orders[detailId];
  if (!o) { back(); return; }
  o = Object.assign({ id: detailId }, o);
  var pa = primaryAction(o);
  var html = '<button type="button" class="back" onclick="back()">‹ 返回</button>' +
    '<div class="card"><div class="r"><div class="car">' + (o.titleFull || o.title) + '</div><div class="dur w">' + o.status + '</div></div>' +
    '<div class="who" style="margin-top:4px">' + o.meta + '</div></div>' +
    '<div class="sect"><span>当前节点</span></div>' +
    '<div class="focus-card"><div class="step">' + o.step + '</div><div class="subline">' + o.subline + '</div></div>';
  if (pa) html += '<button type="button" class="btn" onclick="action(\'' + pa.act + '\',\'' + detailId + '\')">' + pa.label + '</button>';
  html += '<div class="sect"><span>本单资金</span></div><div class="card">';
  (o.money || []).forEach(function (r) {
    html += '<div class="r" style="margin-top:6px"><div class="who">' + r[0] + '</div><div class="car"' + (r[2] ? ' style="' + r[2] + '"' : '') + '>' + r[1] + '</div></div>';
  });
  html += '</div>';
  document.getElementById('s-detail').innerHTML = html;
}

function render() {
  var state = XLLStore.load();
  var titles = { todo: '待办', mine: '我的单', check: '打卡', msg: '消息', detail: '订单详情' };
  var cur = track[track.length - 1];
  document.getElementById('hdTitle').textContent = titles[cur] || '员工端';
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
  if (cur === 'detail') {
    document.getElementById('s-detail').classList.add('on');
    renderDetail(state);
  } else {
    document.getElementById('s-' + cur).classList.add('on');
    if (cur === 'todo') renderTodo(state);
    if (cur === 'mine') renderMine(state);
    if (cur === 'check') renderCheck(state);
    if (cur === 'msg') renderMsg(state);
  }
  document.getElementById('nav').style.display = cur === 'detail' ? 'none' : 'flex';
}

(function init() {
  var bar = document.getElementById('roleBar');
  ROLES.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.role = r.id;
    b.textContent = r.label;
    b.onclick = function () { setRole(r.id); };
    bar.appendChild(b);
  });
  var state = XLLStore.load();
  role = state.role || 'Nina';
  document.querySelectorAll('#roleBar button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.role === role);
  });
  render();
  XLLStore.subscribe(function () {
    if (document.visibilityState === 'visible') render();
  });
})();
</script>
</body>
</html>
