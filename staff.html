<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="汽车贸易管理系统 · 员工端演示（与老板端联动）">
    <title>汽车贸易管理系统 · 员工端</title>
    <style id="theme-vars">
:root {
    --background: #F5F7FA;
    --foreground: #1F2937;
    --card: #FFFFFF;
    --card-foreground: #1F2937;
    --primary: #1E3A5F;
    --primary-foreground: #FFFFFF;
    --secondary: #0D9488;
    --secondary-foreground: #FFFFFF;
    --muted: #F1F5F9;
    --muted-foreground: #64748B;
    --accent: #F1F5F9;
    --accent-foreground: #1E3A5F;
    --destructive: #DC2626;
    --destructive-foreground: #FFFFFF;
    --border: #E2E8F0;
    --input: #E2E8F0;
    --ring: #1E3A5F;
    --radius-sm: 4px;
    --radius-md: 12px;
    --radius-lg: 28px;
    --navy: #1E3A5F;
    --navy-dark: #142A47;
    --navy-soft: #E6EEF7;
    --teal: #0D9488;
    --teal-soft: #CCFBF1;
    --paper: #F5F7FA;
    --ink: #1F2937;
    --danger: #DC2626;
    --warn: #D97706;
    --ok: #059669;
    --hot-bg: #FEF2F2;
    --ok-bg: #ECFDF5;
    --warn-bg: #FFFBEB;
    --shadow-sm: 0 1px 3px rgba(30, 58, 95, 0.06), 0 1px 2px rgba(30, 58, 95, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(30, 58, 95, 0.08), 0 2px 4px -2px rgba(30, 58, 95, 0.04);
    --s: 1.3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--foreground);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    height: 100%; overscroll-behavior: none; }
  button { font-family: inherit; }

  .app { max-width: 480px; margin: 0 auto; height: 100dvh; min-height: 100vh; display: flex; flex-direction: column;
    font-size: calc(16px * var(--s)); background: var(--paper); }

  /* 顶部栏 */
  .top { background: var(--card); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(30, 58, 95, 0.04); padding: env(safe-area-inset-top,0) 14px 12px; flex: none; }
  .top .row { display: flex; align-items: center; gap: 10px; }
  .top .t { font-size: 1em; font-weight: 800; color: var(--navy); flex: 1; letter-spacing: .01em; }
  .link-boss { font-size: 0.625em; font-weight: 600; color: var(--navy); text-decoration: none;
    border: 1px solid var(--navy-soft); background: #fff; border-radius: 999px; padding: 8px 12px; white-space: nowrap;
    box-shadow: var(--shadow-sm); }
  .link-boss:active { background: var(--navy-soft); }

  /* 角色切换 segment control */
  .roles { display: flex; gap: 4px; margin-top: 12px; flex-wrap: nowrap;
    background: var(--accent); border: 1px solid var(--border); border-radius: 999px; padding: 4px; overflow-x: auto; }
  .roles::-webkit-scrollbar { display: none; }
  .roles button {
    flex: 1 1 0; min-width: 72px; border: 0; border-radius: 999px; padding: 8px 10px; font-size: 0.625em;
    font-weight: 600; background: transparent; color: var(--muted-foreground); cursor: pointer;
    white-space: nowrap; transition: all .15s ease;
  }
  .roles button.on { background: var(--card); color: var(--navy); box-shadow: var(--shadow-sm); font-weight: 700; }
  .roles button:active:not(.on) { color: var(--navy); background: rgba(30,58,95,0.04); }

  .body { flex: 1; overflow-y: auto; padding: 14px 14px 16px; }
  .body::-webkit-scrollbar { width: 0; }
  .screen { display: none; }
  .screen.on { display: block; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .sect { font-size: 0.875em; font-weight: 800; margin: 16px 0 10px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  .sect:first-child { margin-top: 2px; }
  .sect span + span { font-size: 0.6875em; font-weight: 500; color: var(--muted-foreground); }

  .row-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .row-item {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); border-left: 4px solid var(--danger); padding: 12px 12px 12px 13px;
    box-shadow: var(--shadow-sm); transition: transform .12s ease, box-shadow .12s ease;
  }
  .row-item.w { border-left-color: var(--warn); }
  .row-item.g { border-left-color: var(--ok); }
  .row-item:active { transform: scale(0.995); box-shadow: var(--shadow-md); }
  .row-main { flex: 1; min-width: 0; cursor: pointer; }
  .r { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .car { font-size: 0.8438em; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
  .meta { font-size: 0.6562em; color: var(--muted-foreground); margin-top: 4px; line-height: 1.45; }
  .dur { font-size: 0.6562em; white-space: nowrap; color: var(--danger); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dur.w { color: var(--warn); }
  .dur.g { color: var(--ok); }

  .btn-sm {
    flex: none; min-width: 68px; min-height: 36px; padding: 0 12px; border: 0;
    border-radius: 999px; background: var(--teal); color: #fff;
    font-size: 0.6875em; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .12s ease, background .12s ease;
  }
  .btn-sm:active { transform: scale(0.96); background: #0F766E; }

  .btn {
    width: 100%; min-height: 46px; margin-top: 10px; border: 1px solid var(--navy); border-radius: 12px;
    background: var(--navy); color: #fff; font-size: 0.8125em; font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .btn:active { transform: scale(0.985); background: var(--navy-dark); border-color: var(--navy-dark); }
  .btn.ghost { background: var(--card); border-color: var(--border); color: var(--foreground); font-weight: 600; }
  .btn.ghost:active { background: var(--accent); border-color: var(--border); }
  .btn:disabled { opacity: .65; cursor: not-allowed; }

  .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 13px; background: var(--card);
    margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .focus-card { border: 1px solid #E8D9B8; border-left: 4px solid var(--teal); border-radius: 12px;
    background: linear-gradient(180deg, var(--warn-bg) 0%, #fff 100%); padding: 14px 13px; margin-bottom: 12px;
    box-shadow: var(--shadow-sm); }
  .focus-card .step { font-size: 0.9375em; font-weight: 800; color: var(--ink); line-height: 1.35; }
  .focus-card .subline { font-size: 0.6562em; color: var(--muted-foreground); margin-top: 6px; line-height: 1.55; }
  .empty { text-align: center; padding: 32px 14px; color: var(--muted-foreground); font-size: 0.75em; }

  /* 底部导航 */
  .nav { display: flex; border-top: 1px solid var(--border); background: var(--card); flex: none;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0)); gap: 6px; box-shadow: 0 -1px 0 rgba(30,58,95,0.03); }
  .nav button {
    flex: 1; background: transparent; border: 0; font-size: 0.625em; color: var(--muted-foreground);
    padding: 8px 4px 10px; cursor: pointer; font-weight: 600; min-height: 44px; border-radius: 999px;
    transition: all .15s ease;
  }
  .nav button.on { background: var(--navy); color: #fff; box-shadow: var(--shadow-sm); font-weight: 700; }
  .nav button:active:not(.on) { background: var(--accent); color: var(--navy); }

  .toast {
    position: fixed; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%);
    background: var(--navy); color: #fff; font-size: 0.75em; padding: 10px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .22s; pointer-events: none; z-index: 20; max-width: 90%; text-align: center;
    box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; }
  .who { font-size: 0.625em; color: var(--muted-foreground); line-height: 1.5; }
  .back { border: 0; background: transparent; color: var(--navy); font-size: 0.9375em; padding: 4px 8px 4px 0; cursor: pointer; font-weight: 700; }

  @media (min-width: 520px) {
    html, body { background: #E8ECF1; }
    .app { margin: 24px auto; height: 772px; min-height: 772px; border: 1px solid #D8DEE6; border-radius: 28px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(30, 58, 95, 0.12); }
  }

<body>
<div class="app">
  <div class="top">
    <div class="row">
      <div class="t" id="hdTitle">员工端</div>
      <div class="lang" style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:0.625em;margin-right:6px;background:#fff">
        <span class="on" id="lzh" onclick="setLang('zh')" role="button" tabindex="0" style="padding:6px 8px;cursor:pointer">中文</span>
        <span id="lru" onclick="setLang('ru')" role="button" tabindex="0" style="padding:6px 8px;cursor:pointer">Рус</span>
      </div>
      <a class="link-boss" href="./index.html" id="linkBoss">老板端</a>
    </div>
    <div class="roles" id="roleBar" role="tablist" aria-label="roles"></div>
  </div>

  <div class="body">
    <div class="screen on" id="s-todo"></div>
    <div class="screen" id="s-mine"></div>
    <div class="screen" id="s-check"></div>
    <div class="screen" id="s-msg"></div>
    <div class="screen" id="s-detail"></div>
  </div>

  <div class="nav" id="nav">
    <button type="button" class="on" data-t="todo" onclick="tab('todo')" data-i="tabTodo">待办</button>
    <button type="button" data-t="mine" onclick="tab('mine')" data-i="tabMine">我的单</button>
    <button type="button" data-t="check" onclick="tab('check')" data-i="tabCheck">打卡</button>
    <button type="button" data-t="msg" onclick="tab('msg')" data-i="tabMsg">消息</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="./i18n.js"></script>
<script src="./store.js"></script>
<script>
var lang = (function () { try { return localStorage.getItem('xll_lang') || 'zh'; } catch (e) { return 'zh'; } })();
function t(key, vars) { return XLLI18N.t(lang, key, vars); }
function tr(s) { return XLLI18N.tr(lang, s); }

function roleDefs() {
  return [
    { id: 'Nina', labelKey: 'roleNina' },
    { id: '张青昊', labelKey: 'roleZhang' },
    { id: '波塔', labelKey: 'roleBota' },
    { id: '那尔', labelKey: 'roleNar' }
  ];
}

var role = 'Nina';
var tabName = 'todo';
var detailId = null;
var track = ['todo'];
var toastTimer = null;

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

function paintChrome() {
  document.getElementById('lzh').classList.toggle('on', lang === 'zh');
  document.getElementById('lru').classList.toggle('on', lang === 'ru');
  document.getElementById('lzh').style.background = lang === 'zh' ? 'var(--navy-soft)' : '#fff';
  document.getElementById('lzh').style.color = lang === 'zh' ? 'var(--navy)' : 'var(--muted-foreground)';
  document.getElementById('lru').style.background = lang === 'ru' ? 'var(--navy-soft)' : '#fff';
  document.getElementById('lru').style.color = lang === 'ru' ? 'var(--navy)' : 'var(--muted-foreground)';
  document.getElementById('linkBoss').textContent = t('linkBoss');
  document.querySelectorAll('#nav [data-i]').forEach(function (el) {
    el.textContent = t(el.getAttribute('data-i'));
  });
  var bar = document.getElementById('roleBar');
  bar.innerHTML = '';
  roleDefs().forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.role = r.id;
    b.textContent = t(r.labelKey);
    b.className = r.id === role ? 'on' : '';
    b.onclick = function () { setRole(r.id); };
    bar.appendChild(b);
  });
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('xll_lang', l); } catch (e) {}
  document.documentElement.lang = l === 'ru' ? 'ru' : 'zh-CN';
  paintChrome();
  render();
}

function setRole(id) {
  role = id;
  XLLStore.applyAction('set_role', { role: id });
  document.querySelectorAll('#roleBar button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.role === id);
  });
  if (track[track.length - 1] === 'detail') { track = [tabName]; detailId = null; }
  render();
}

function tab(name) {
  tabName = name;
  track = [name];
  detailId = null;
  document.querySelectorAll('#nav button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.t === name);
  });
  render();
}

function openDetail(id) {
  detailId = id;
  track.push('detail');
  render();
}

function back() {
  if (track.length > 1) {
    track.pop();
    detailId = null;
    render();
  }
}

function action(name, orderId) {
  var res = XLLStore.applyAction(name, { orderId: orderId, role: role });
  if (res.toast) showToast(tr(res.toast));
  render();
}

function primaryAction(o) {
  if (!o || o.owner !== role) return null;
  if ((role === 'Nina' || role === '张青昊') && o.assignee.sales === role) {
    if (o.phase === 'inquiry' && !o.accepted) return { act: 'accept', label: t('actAccept') };
    if (o.phase === 'inquiry') return { act: 'quote', label: t('actQuote') };
    if (o.phase === 'quoted') return { act: 'lock', label: t('actLock') };
  }
  if (role === '波塔' && o.phase === 'fx' && o.assignee.office === role) {
    return { act: 'fx_done', label: t('actFx') };
  }
  if (role === '那尔' && o.phase === 'inspect' && o.assignee.field === role) {
    if (!o.videoUploaded) return { act: 'upload_video', label: t('actUploadVideo') };
    return { act: 'inspect_done', label: t('actInspect') };
  }
  return null;
}

function isSalesRole() {
  return role === 'Nina' || role === '张青昊';
}

function rowHtml(o, withBtn) {
  var pa = withBtn ? primaryAction(o) : null;
  var cls = o.stuck ? 'row-item' : 'row-item w';
  if (!o.stuck && (o.phase === 'quoted' || o.phase === 'locked' || o.phase === 'license' || o.phase === 'exit')) cls = 'row-item g';
  var btn = pa
    ? '<button type="button" class="btn-sm" onclick="event.stopPropagation();action(\'' + pa.act + '\',\'' + o.id + '\')">' + pa.label + '</button>'
    : '';
  var meta = tr(o.stepShort) + ' · ' + o.owner;
  if (o.phase === 'inspect' && !o.videoUploaded) meta += ' · ' + t('videoPending');
  if (o.phase === 'inspect' && o.videoUploaded) meta += ' · ' + t('videoDone');
  return '<div class="' + cls + '">' +
    '<div class="row-main" onclick="openDetail(\'' + o.id + '\')">' +
      '<div class="r"><div class="car">' + o.title + '</div><div class="dur">' + tr(o.dur) + '</div></div>' +
      '<div class="meta">' + meta + '</div>' +
    '</div>' + btn + '</div>';
}

function renderTodo(state) {
  var list = XLLStore.todosForRole(state, role);
  var html = '<div class="sect"><span>' + t('todayTodo') + '</span><span>' + role + '</span></div>';
  if (!list.length) html += '<div class="empty">' + t('emptyTodo') + '</div>';
  else {
    html += '<div class="row-list">';
    list.forEach(function (o) { html += rowHtml(o, true); });
    html += '</div>';
  }
  document.getElementById('s-todo').innerHTML = html;
}

function renderMine(state) {
  var list = XLLStore.myOrders(state, role);
  var html = '<div class="sect"><span>' + t('myOrders') + '</span><span>' + t('ordersN', { n: list.length }) + '</span></div>';
  html += '<div class="who" style="margin:-2px 0 8px">' + t('myOrdersHint') + '</div><div class="row-list">';
  if (!list.length) html += '<div class="empty">' + t('emptyMine') + '</div>';
  else list.forEach(function (o) { html += rowHtml(o, false); });
  html += '</div>';
  document.getElementById('s-mine').innerHTML = html;
}

function renderCheck(state) {
  var html = '<div class="sect"><span>' + t('todayCheck') + '</span></div>';
  if (isSalesRole()) {
    var done = !!(state.dailyReport && state.dailyReport[role]);
    html += '<div class="card"><div class="car" style="font-size:0.875em">' + t('dailyTitle') + '</div>' +
      '<div class="who" style="margin-top:6px">' + t('dailyHint') + '</div>';
    html += done
      ? '<button type="button" class="btn ghost" disabled>' + t('dailyDone') + '</button>'
      : '<button type="button" class="btn" onclick="action(\'daily_report\')">' + t('dailySubmit') + '</button>';
    html += '</div>';
  } else if (role === '波塔') {
    var cin = !!(state.checkIn && state.checkIn[role]);
    html += '<div class="card"><div class="car" style="font-size:0.875em">' + t('officeCheck') + '</div>' +
      '<div class="who" style="margin-top:6px">' + t('officeHint') + '</div>';
    html += cin
      ? '<button type="button" class="btn ghost" disabled>' + t('officeDone') + '</button>'
      : '<button type="button" class="btn" onclick="action(\'check_in\')">' + t('officeGo') + '</button>';
    html += '</div>';
  } else if (role === '那尔') {
    var fr = !!(state.fieldReport && state.fieldReport[role]);
    html += '<div class="card"><div class="car" style="font-size:0.875em">' + t('fieldCheck') + '</div>' +
      '<div class="who" style="margin-top:6px">' + t('fieldHint') + '</div>';
    html += fr
      ? '<button type="button" class="btn ghost" disabled>' + t('fieldDone') + '</button>'
      : '<button type="button" class="btn" onclick="action(\'field_report\')">' + t('fieldGo') + '</button>';
    html += '</div>';
  }
  html += '<button type="button" class="btn ghost" onclick="var r=XLLStore.applyAction(\'reset\',{});showToast(tr(r.toast));render();">' + t('resetDemo') + '</button>';
  html += '<div class="who" style="margin-top:10px;text-align:center">' + t('syncHint') + '</div>';
  document.getElementById('s-check').innerHTML = html;
}

function renderMsg(state) {
  var list = XLLStore.messagesFor(state, role);
  var html = '<div class="sect"><span>' + t('msgTitle') + '</span><span>' + t('msgSub') + '</span></div><div class="row-list">';
  if (!list.length) html += '<div class="empty">' + t('emptyMsg') + '</div>';
  else list.forEach(function (m) {
    html += '<div class="row-item w" onclick="' + (m.orderId ? 'openDetail(\'' + m.orderId + '\')' : '') + '">' +
      '<div class="row-main"><div class="r"><div class="car">' + tr(m.title) + '</div><div class="dur w">' + m.t + '</div></div>' +
      '<div class="meta">' + tr(m.body) + '</div></div></div>';
  });
  html += '</div>';
  document.getElementById('s-msg').innerHTML = html;
}

function renderDetail(state) {
  var o = state.orders[detailId];
  if (!o) { back(); return; }
  o = Object.assign({ id: detailId }, o);
  var pa = primaryAction(o);
  var html = '<button type="button" class="back" onclick="back()">' + t('back') + '</button>' +
    '<div class="card"><div class="r"><div class="car">' + (o.titleFull || o.title) + '</div><div class="dur w">' + tr(o.status) + '</div></div>' +
    '<div class="who" style="margin-top:4px">' + o.meta + '</div></div>' +
    '<div class="sect"><span>' + t('stuckNow') + '</span></div>' +
    '<div class="focus-card"><div class="step">' + tr(o.step) + '</div><div class="subline">' + tr(o.subline) + '</div></div>';
  if (pa) html += '<button type="button" class="btn" onclick="action(\'' + pa.act + '\',\'' + detailId + '\')">' + pa.label + '</button>';
  if (!isSalesRole()) {
    html += '<div class="sect"><span>' + t('money1') + '</span></div><div class="card">';
    (o.money || []).forEach(function (r) {
      html += '<div class="r" style="margin-top:6px"><div class="who">' + tr(r[0]) + '</div><div class="car"' + (r[2] ? ' style="' + r[2] + '"' : '') + '>' + tr(r[1]) + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="who" style="margin-top:8px">' + t('salesDetailHint') + '</div>';
  }
  document.getElementById('s-detail').innerHTML = html;
}

function render() {
  var state = XLLStore.load();
  var titleMap = { todo: 'tabTodo', mine: 'tabMine', check: 'tabCheck', msg: 'tabMsg', detail: 't_detail' };
  var cur = track[track.length - 1];
  document.getElementById('hdTitle').textContent = t(titleMap[cur] || 'staffTitle');
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
  if (cur === 'detail') {
    document.getElementById('s-detail').classList.add('on');
    renderDetail(state);
  } else {
    document.getElementById('s-' + cur).classList.add('on');
    if (cur === 'todo') renderTodo(state);
    if (cur === 'mine') renderMine(state);
    if (cur === 'check') renderCheck(state);
    if (cur === 'msg') renderMsg(state);
  }
  document.getElementById('nav').style.display = cur === 'detail' ? 'none' : 'flex';
}

(function init() {
  var state = XLLStore.load();
  role = state.role || 'Nina';
  paintChrome();
  render();
  XLLStore.subscribe(function () {
    if (document.visibilityState === 'visible') render();
  });
})();
</script>
</body>
</html>
